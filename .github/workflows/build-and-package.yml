name: Build & Package Cardputer ZERO OpenGGS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  desktop-test:
    name: Desktop Build & Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev

      - name: Configure CMake
        run: cmake -B build/desktop -DCMAKE_BUILD_TYPE=Release -DTARGET_DEVICE=DESKTOP -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build/desktop --parallel

      - name: Run Smoke Test
        run: |
          chmod +x tests/smoke_test.sh
          ./tests/smoke_test.sh

  package-deb:
    name: Build ARM64 Debian Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu dpkg-dev

      - name: Package .deb
        run: |
          chmod +x packaging/pack-deb.sh
          ./packaging/pack-deb.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardputerzero-openggs-deb
          path: dist/*.deb
